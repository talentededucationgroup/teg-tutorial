name: Ambil kandidat foto topik berita (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/topic-photo-request.json']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      - run: python scripts/fetch_topic_photos.py
        env:
          TOPICS: ${{ github.event_name == 'push' && 'health,cookery,it,construction,business,childcare,city-au' || '' }}
      - run: |
          git config user.name "teg-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/photos/candidates
          git diff --cached --quiet || (git commit -m "Kandidat foto topik berita" && git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main)
