name: Feed "Yang baru" + notifikasi push

on:
  push:
    branches: [main]
    paths:
      - 'data/news.json'
      - 'data/scholarships.json'
      - 'data/banners.json'
      - 'data/jobs.json'
      - 'data/accommodation.json'
      - 'data/community-postings.json'
      - 'data/social-posts.json'
      - 'data/social-autopost.json'
      - 'data/social-review.json'
      - 'data/site-promo.json'
      - 'scripts/program_posts.py'
      - 'scripts/trust_posts.py'
  workflow_run:
    workflows: ["Update lowongan kerja (2x sehari)"]
    types: [completed]
  schedule:
    - cron: '23 1,5,9,13 * * *'   # 08:23, 12:23, 16:23, 20:23 WIB - kirim push yang tertunda
    - cron: '7 2 * * *'           # 09:07 WIB - tayangkan item jam 09.00 yang sudah LOLOS QA pagi (24/11/2026)
  workflow_dispatch: {}

concurrency:
  group: updates-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q pillow 'opencv-python-headless<5' imageio-ffmpeg pypdf
      - name: Foto kota berlisensi bebas untuk akomodasi baru (Wikimedia Commons)
        run: python scripts/fill_photos.py || true
      - name: Bangun feed & kirim push (bila secret OneSignal ada)
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/build_updates.py
      - name: Commit feed
        run: |
          git config user.name "teg-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/updates.json data/updates-state.json data/accommodation.json social-feed.xml social-feed-story.xml social-feed-reels.xml social/ data/social-photos.json data/social-log.json data/social-need-photo.json data/buffer-sent.json data/social-review.json data/social-wall.json; do [ -e "$f" ] && git add -A -- "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "Feed yang baru otomatis $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main
          fi
      - name: Kirim postingan baru ke Buffer (setelah poster terbit di GitHub Pages)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WAIT_MEDIA_SECONDS: '540'
        run: python scripts/post_to_buffer.py || true
      - name: Cek postingan benar-benar tayang (IG/FB feed & story)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          VERIFY_WAIT_SECONDS: '180'
        run: python scripts/verify_buffer.py || true
      - name: Simpan status kiriman Buffer
        run: |
          for f in data/buffer-sent.json data/social-review.json data/buffer-verify.json; do [ -e "$f" ] && git add -A -- "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "Status kiriman Buffer $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main
          fi
