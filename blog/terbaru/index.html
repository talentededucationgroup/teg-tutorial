<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="only light">
<title>Artikel Terbaru Talented</title><meta name="robots" content="noindex,follow"><link rel="icon" href="/tim/favicon-talented.png">
<style>:root{color-scheme:only light}*{box-sizing:border-box}body{margin:0;background:#f8f7f3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:#14213d}
main{max-width:1200px;margin:0 auto;padding:16px}body.embed{background:transparent}body.embed main{padding:2px 0}
h2{margin:0 0 10px;font-size:1.35rem}.hd{display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;gap:6px}.nav button{width:38px;height:38px;border-radius:50%;border:1.5px solid #c9a227;background:#fff;color:#14213d;font-size:18px;cursor:pointer}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px}
.card{flex:0 0 300px;scroll-snap-align:start;background:#fff;border-radius:14px;border-top:5px solid #c9a227;box-shadow:0 2px 10px rgba(20,33,61,.1);padding:14px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;min-height:250px}
.dt{font-size:.78rem;color:#8a6623;font-weight:700}.tt{font-weight:800;font-size:1.02rem;line-height:1.3}
.ds{font-size:.88rem;color:#4a5a66;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.go{margin-top:auto;align-self:flex-start;background:#14213d;color:#fff;border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:700}
.all{display:inline-block;margin-top:4px;color:#14213d;font-weight:700}@media(max-width:520px){.card{flex-basis:82%}.nav{display:none}}</style><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><style id="gd-theme">body{font-family:"Source Sans 3",system-ui,sans-serif!important;color:#161616}h2,h3,.tt,.grp h3,.grp h4{font-family:Oswald,"Arial Narrow",sans-serif!important;text-transform:uppercase;letter-spacing:.02em}.go,.more{background:#161616!important;color:#fff!important;border-radius:3px!important;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem!important}.nav button{border-color:#759ba1!important;color:#161616!important}.dt{color:#4f7b82!important}.card{border-top:5px solid #95c2c9!important;border-radius:6px!important}.all{color:#161616!important;text-transform:uppercase;letter-spacing:.06em;font-family:Oswald,sans-serif}.grp h3{border-bottom-color:#95c2c9!important}.grp h4{color:#4f7b82!important}.t{border-radius:6px!important}a.t:hover{box-shadow:0 6px 16px rgba(79,123,130,.25)!important}.nm{border-top-color:#95c2c9!important}.ln{border-radius:3px!important}a.ln:hover{border-color:#759ba1!important;background:#eef5f6!important}.bar select,.bar input{border-radius:3px!important}</style></head>
<body><main><div class="hd"><h2 id="h">Artikel terbaru</h2><div class="nav"><button id="pv" aria-label="prev">‹</button><button id="nx" aria-label="next">›</button></div></div>
<div class="strip" id="s"></div><a class="all" id="all" target="_blank" rel="noopener" href="https://info.talentededucationgroup.com/blog/">Semua artikel →</a></main>
<script>
/* Artikel blog terbaru (data/blog.json, ditulis otomatis tiap bulan). Embed: /blog/terbaru/?embed=1&lang=id|en&n=6 (pemilik 27/11/2026: tampil di talentededucationgroup.com). */
const q=new URLSearchParams(location.search),en=(q.get('lang')||'id').startsWith('en'),N=Math.min(12,+q.get('n')||6);
const T=en?['Latest articles','Read article','All articles →']:['Artikel terbaru','Baca artikel','Semua artikel →'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(q.get('embed')==='1')document.body.classList.add('embed');if(q.get('notitle')==='1')document.getElementById('h').style.display='none';document.documentElement.lang=en?'en':'id';
document.getElementById('h').textContent=T[0];const all=document.getElementById('all');all.textContent=T[2];if(en)all.href+='en/';
const s=document.getElementById('s');document.getElementById('pv').onclick=()=>s.scrollBy({left:-310,behavior:'smooth'});document.getElementById('nx').onclick=()=>s.scrollBy({left:310,behavior:'smooth'});
fetch('/data/blog.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
 const ps=(d.posts||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,N),L=en?'en':'id';
 const fmt=x=>{try{return new Date(x+'T00:00:00').toLocaleDateString(en?'en-AU':'id-ID',{day:'numeric',month:'short',year:'numeric'})}catch{return x}};
 s.innerHTML=ps.map(p=>{const slug=encodeURIComponent(p.slug),u=`https://info.talentededucationgroup.com/blog/${en?'en/':''}${slug}/`;
  return `<a class="card" href="${u}" target="_blank" rel="noopener"><span class="dt">${esc(fmt(p.updated||p.date))}</span><span class="tt">${esc((p.title||{})[L]||(p.title||{}).id)}</span><span class="ds">${esc((p.description||{})[L]||(p.description||{}).id)}</span><span class="go">${T[1]}</span></a>`}).join('');
}).catch(()=>{s.textContent='—'});
</script><script>/* tinggi otomatis untuk embed GoDaddy */(function(){if(window.parent===window)return;var last=0;function s(){var h=Math.ceil(document.documentElement.scrollHeight);if(Math.abs(h-last)>4){last=h;parent.postMessage({tegH:h},"*")}}addEventListener("load",s);setInterval(s,800);if(window.ResizeObserver)new ResizeObserver(s).observe(document.documentElement)})();</script></body></html>
