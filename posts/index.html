<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="only light">
<title>Info & Promo Terbaru Talented</title><meta name="description" content="Postingan terbaru Talented Education Group: promo, beasiswa, berita visa dan info studi ke luar negeri.">
<link rel="icon" href="/tim/favicon-talented.png">
<style>:root{color-scheme:only light}*{box-sizing:border-box}body{margin:0;background:#f8f7f3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:#14213d}
main{max-width:1200px;margin:0 auto;padding:16px}body.embed{background:transparent}body.embed main{padding:2px 0}
h2{margin:0 0 10px;font-size:1.35rem}.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav{display:flex;gap:6px}.nav button{width:38px;height:38px;border-radius:50%;border:1.5px solid #c9a227;background:#fff;color:#14213d;font-size:18px;cursor:pointer}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin}
.card{flex:0 0 260px;scroll-snap-align:start;background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(20,33,61,.1);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eef1f4;display:block}
.bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}.dt{font-size:.78rem;color:#8a6623;font-weight:700}
.tt{font-weight:700;font-size:.95rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.go{margin-top:auto;align-self:flex-start;background:#14213d;color:#fff;border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:700}
.all{display:inline-block;margin-top:4px;color:#14213d;font-weight:700}.empty{color:#6b7280}
@media(max-width:520px){.card{flex-basis:78%}.nav{display:none}}</style></head>
<body><main><div class="hd"><h2 id="h">Info & promo terbaru</h2><div class="nav"><button id="pv" aria-label="prev">‹</button><button id="nx" aria-label="next">›</button></div></div>
<div class="strip" id="s"></div><a class="all" id="all" target="_blank" rel="noopener" href="https://pricelist.talentededucationgroup.com/?tab=updates">Lihat semua →</a></main>
<script>
/* Postingan sosmed terbaru (data/social-wall.json, dibuat otomatis). Pemakaian: /posts/?embed=1&lang=id&n=10 (pemilik 27/11/2026: tampil di talentededucationgroup.com GoDaddy).
   Postingan yang diberi putusan REVISI/TOLAK oleh QA sosmed tidak ditampilkan. */
const q=new URLSearchParams(location.search),lang=(q.get('lang')||'id').slice(0,2),N=Math.min(24,+q.get('n')||10);
const B={id:['Lihat','Lihat semua →'],en:['View','See all →'],th:['ดู','ดูทั้งหมด →'],vi:['Xem','Xem tất cả →'],zh:['查看','查看全部 →'],ja:['見る','すべて見る →'],ko:['보기','전체 보기 →'],km:['មើល','មើលទាំងអស់ →'],fr:['Voir','Tout voir →'],pt:['Ver','Ver tudo →'],es:['Ver','Ver todo →'],de:['Ansehen','Alle ansehen →'],it:['Vedi','Vedi tutto →'],nl:['Bekijk','Alles bekijken →'],ru:['Открыть','Смотреть все →']};
const L=B[lang]||B.en,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch{return ''}};
if(q.get('embed')==='1')document.body.classList.add('embed');document.documentElement.lang=lang;
const all=document.getElementById('all');all.textContent=L[1];all.href+='&lang='+encodeURIComponent(lang);
const s=document.getElementById('s');
document.getElementById('pv').onclick=()=>s.scrollBy({left:-280,behavior:'smooth'});document.getElementById('nx').onclick=()=>s.scrollBy({left:280,behavior:'smooth'});
Promise.all([fetch('/data/social-wall.json',{cache:'no-cache'}).then(r=>r.json()),fetch('/data/social-review.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({items:{}}))]).then(([w,rv])=>{
 const t=w.labels&&w.labels.title;if(t)document.getElementById('h').textContent=t[lang]||t.en||t.id;
 const bad=id=>{const v=(rv.items||{})[id];return v&&/REVISI|TOLAK|GAGAL/i.test(v.verdict||'')};
 const it=(w.items||[]).filter(x=>x.image&&!bad(x.id)).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,N);
 if(!it.length){s.innerHTML='<p class="empty">—</p>';return}
 const fmt=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString(lang==='id'?'id-ID':lang,{day:'numeric',month:'short',year:'numeric'})}catch{return d}};
 s.innerHTML=it.map(x=>{const link=safe(x.link)||'https://pricelist.talentededucationgroup.com/';return `<a class="card" href="${esc(link)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(safe(x.image))}" alt="${esc(x.title)}"><div class="bd"><span class="dt">${esc(fmt(x.date))}</span><span class="tt">${esc(x.title)}</span><span class="go">${esc(L[0])}</span></div></a>`}).join('');
}).catch(()=>{s.innerHTML='<p class="empty">—</p>'});
</script></body></html>
