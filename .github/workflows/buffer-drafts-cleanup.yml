name: Hapus Draft lama Buffer (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect, delete (draft lama), count_queue, delete_queue (kosongkan antrean terjadwal)'
        default: 'inspect'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: python scripts/buffer_drafts_cleanup.py
      - name: Simpan buffer-sent.json (mode resync_sent)
        if: ${{ github.event.inputs.mode == 'resync_sent' }}
        run: |
          git config user.name "teg-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/buffer-sent.json
          if ! git diff --cached --quiet; then
            git commit -m "Selaraskan buffer-sent dengan postingan yang sudah tayang $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main
          fi
