name: Feed "Yang baru" + notifikasi push

on:
  push:
    branches: [main]
    paths:
      - 'data/news.json'
      - 'data/scholarships.json'
      - 'data/banners.json'
      - 'data/jobs.json'
      - 'data/accommodation.json'
      - 'data/community-postings.json'
      - 'data/social-posts.json'
  workflow_run:
    workflows: ["Update lowongan kerja (2x sehari)"]
    types: [completed]
  schedule:
    - cron: '23 1,5,9,13 * * *'   # 08:23, 12:23, 16:23, 20:23 WIB - kirim push yang tertunda
  workflow_dispatch: {}

concurrency:
  group: updates-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      - name: Foto kota berlisensi bebas untuk akomodasi baru (Wikimedia Commons)
        run: python scripts/fill_photos.py || true
      - name: Bangun feed & kirim push (bila secret OneSignal ada)
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/build_updates.py
      - name: Commit feed
        run: |
          git config user.name "teg-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/updates.json data/updates-state.json data/accommodation.json social-feed.xml social/ data/social-photos.json
          if ! git diff --cached --quiet; then
            git commit -m "Feed yang baru otomatis $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
