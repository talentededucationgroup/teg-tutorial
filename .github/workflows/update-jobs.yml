name: Update lowongan kerja (harian)

on:
  schedule:
    - cron: '17 22 * * *'   # 05:17 WIB setiap hari
  workflow_dispatch: {}      # tombol "Run workflow" = update manual dengan pemeriksaan yang sama

concurrency:
  group: update-jobs
  cancel-in-progress: false  # cegah proses berjalan ganda

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ambil & periksa lowongan
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/update_jobs.py
      - name: Commit bila ada perubahan
        if: always()
        run: |
          git config user.name "teg-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/jobs-log.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update lowongan otomatis $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push
          fi
      - name: Notifikasi admin (issue GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ] || [ -s jobs-alerts.txt ]; then
            body="Status: ${{ job.status }}. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            [ -s jobs-alerts.txt ] && body="$body"$'\n\n'"$(cat jobs-alerts.txt)"
            gh issue create --title "Update lowongan perlu dicek ($(date -u +%Y-%m-%d))" --body "$body" || true
          fi
